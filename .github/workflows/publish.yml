name: publish

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
          registry-url: "https://registry.npmjs.org"
          scope: "@akoenig"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: vp install

      - name: Check
        run: vp check --no-fmt

      - name: Test
        run: vp test

      - name: Set release version
        run: corepack pnpm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Build
        run: vp run build

      - name: Publish to npm
        run: corepack pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Sync release version to main
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git fetch origin main
          git switch main
          CURRENT="$(corepack pnpm pkg get version | tr -d '"')"
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "package.json already at $VERSION on main; nothing to sync."
            exit 0
          fi
          corepack pnpm pkg set version="$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: set package.json version to $VERSION [skip ci]"
          git push origin main
